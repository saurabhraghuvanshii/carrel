name: release

# Runs when the draft from release-draft.yml is published, and attaches the binaries.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  binaries:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: go test ./...
      - run: make dist VERSION="$TAG"
      - name: attach
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/carrel_* dist/checksums.txt --clobber
