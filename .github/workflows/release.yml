name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: go test ./...
      - run: make dist VERSION=${{ github.ref_name }}
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # A tag with a hyphen (v0.1.0-rc1) becomes a pre-release, so "latest" still points at a real one.
          flags=""
          case "$TAG" in *-*) flags="--prerelease" ;; esac
          gh release create "$TAG" dist/carrel_* dist/checksums.txt --title "$TAG" --generate-notes --verify-tag $flags
