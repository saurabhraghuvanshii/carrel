<section id="themes" class="sec sec-top">
  <div class="wrap">
    <div class="grid-2 themes-grid">
      <div>
        <p class="eyebrow">Looks</p>
        <h2 class="h2">Calm by default. Yours if you like.</h2>
        <p class="lead">Two themes and five accent colours. Easy, Medium and Hard keep the same colours everywhere, so a tag always reads the same. Try it. This page changes too.</p>
      </div>
      <div class="card themes-card">
        <div class="themes-group" role="group" aria-labelledby="themes-l-theme">
          <div class="mono themes-label" id="themes-l-theme">Theme</div>
          <div class="themes-row">
            <button class="btn primary" type="button" data-theme-set="paper" aria-pressed="true">Paper</button>
            <button class="btn" type="button" data-theme-set="ink" aria-pressed="false">Ink</button>
          </div>
        </div>
        <div class="themes-group" role="group" aria-labelledby="themes-l-accent">
          <div class="mono themes-label" id="themes-l-accent">Accent</div>
          <div class="themes-row themes-swatches">
            <button class="swatch" type="button" data-accent-set="brick" aria-label="Brick" aria-pressed="true"></button>
            <button class="swatch" type="button" data-accent-set="forest" aria-label="Forest" aria-pressed="false"></button>
            <button class="swatch" type="button" data-accent-set="amber" aria-label="Amber" aria-pressed="false"></button>
            <button class="swatch" type="button" data-accent-set="slate" aria-label="Slate" aria-pressed="false"></button>
            <button class="swatch" type="button" data-accent-set="plum" aria-label="Plum" aria-pressed="false"></button>
          </div>
        </div>
        <div class="themes-group">
          <div class="mono themes-label">Difficulty</div>
          <div class="themes-row">
            <span class="tag easy">Easy</span><span class="tag medium">Medium</span><span class="tag hard">Hard</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
