<section id="start" class="sec sec-top cta">
  <div class="wrap">
    <h2 class="h2 cta-h2">Open it and start.</h2>
    <p class="lead cta-lead">One command, then your first problem.</p>
    <div class="install cta-install">
      <div class="cmdbox">
        <span class="prompt" aria-hidden="true">$</span>
        <code class="cmd" id="install-cmd-2">curl -fsSL https://{{domain}}/install.sh | sh</code>
        <button class="btn small" type="button" data-copy data-copy-target="#install-cmd-2" aria-live="polite">Copy</button>
      </div>
      <a class="btn primary" href="{{repo}}">View on GitHub</a>
    </div>
  </div>
</section>
