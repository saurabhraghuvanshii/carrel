<section id="sheets" class="sec sec-top" data-loop>
  <div class="wrap">
    <div class="grid-2 sheets-grid">
      <div>
        <p class="eyebrow">Sheets</p>
        <h2 class="h2">Two sheets, one calm list</h2>
        <p class="lead"><strong class="sheets-strong">Patterns</strong> teaches one idea at a time, in learning order, about a hundred problems.</p>
        <p class="lead sheets-lead2"><strong class="sheets-strong">Real interviews</strong> are longer, story-style problems like dispatching a driver or limiting requests, each with a follow-up question.</p>
        <p class="sheets-note">Every problem carries a tag: Easy, Medium or Hard.</p>
      </div>
      <figure class="card sheets-card" role="img" aria-label="Two sheets, Patterns and Real interviews, switching in a loop.">
        <div aria-hidden="true">
          <div class="sheets-tabs">
            <span class="sheets-tab">Patterns</span>
            <span class="sheets-tab">Real interviews</span>
            <span class="sheets-line"></span>
          </div>
          <div class="sheets-body">
            <div class="sheets-panel panelA">
              <div class="sheets-row">
                <div class="sheets-text"><div class="sheets-title">Pair with target sum</div><div class="mono sheets-group">Arrays and hashing</div></div>
                <div class="sheets-meta"><span class="tag easy">Easy</span><span class="dot solved"></span></div>
              </div>
              <div class="sheets-row">
                <div class="sheets-text"><div class="sheets-title">Subarray with a given sum</div><div class="mono sheets-group">Arrays and hashing</div></div>
                <div class="sheets-meta"><span class="tag medium">Medium</span><span class="dot tried"></span></div>
              </div>
              <div class="sheets-row">
                <div class="sheets-text"><div class="sheets-title">Longest run with at most k changes</div><div class="mono sheets-group">Sliding window</div></div>
                <div class="sheets-meta"><span class="tag medium">Medium</span><span class="dot none"></span></div>
              </div>
              <div class="sheets-row">
                <div class="sheets-text"><div class="sheets-title">Window maximum</div><div class="mono sheets-group">Sliding window</div></div>
                <div class="sheets-meta"><span class="tag hard">Hard</span><span class="dot none"></span></div>
              </div>
            </div>
            <div class="sheets-panel panelB">
              <div class="sheets-row rowB" style="animation-delay: 0s">
                <div class="sheets-text"><div class="sheets-title">Nearest available driver</div><div class="mono sheets-group">Ride dispatch</div></div>
                <div class="sheets-meta"><span class="tag medium">Medium</span><span class="dot tried"></span></div>
              </div>
              <div class="sheets-row rowB" style="animation-delay: 0.08s">
                <div class="sheets-text"><div class="sheets-title">Rate limiter</div><div class="mono sheets-group">Request handling, with follow-up</div></div>
                <div class="sheets-meta"><span class="tag medium">Medium</span><span class="dot none"></span></div>
              </div>
              <div class="sheets-row rowB" style="animation-delay: 0.16s">
                <div class="sheets-text"><div class="sheets-title">Cache with eviction</div><div class="mono sheets-group">Design, with follow-up</div></div>
                <div class="sheets-meta"><span class="tag medium">Medium</span><span class="dot none"></span></div>
              </div>
              <div class="sheets-row rowB" style="animation-delay: 0.24s">
                <div class="sheets-text"><div class="sheets-title">Surge price from recent requests</div><div class="mono sheets-group">Ride dispatch</div></div>
                <div class="sheets-meta"><span class="tag hard">Hard</span><span class="dot none"></span></div>
              </div>
            </div>
          </div>
        </div>
      </figure>
    </div>
  </div>
</section>
