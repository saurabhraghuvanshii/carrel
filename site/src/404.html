(function () {
  var r = document.documentElement, t = null, a = null;
  r.setAttribute('data-theme-js', '');
  try { t = localStorage.getItem('carrel-theme'); a = localStorage.getItem('carrel-accent'); } catch (e) {}
  if (t !== 'paper' && t !== 'ink') t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'ink' : 'paper';
  r.setAttribute('data-theme', t);
  if (['brick', 'forest', 'amber', 'slate', 'plum'].indexOf(a) >= 0) r.setAttribute('data-accent', a);
})();
</script>
